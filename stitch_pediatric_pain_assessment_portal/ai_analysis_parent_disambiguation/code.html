<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1745ef">
  <title>Parent Confirmation | LittleCare AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "Plus Jakarta Sans", sans-serif;
      color: #102454;
      background: #eaf0ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-y: visible;
      background:
        radial-gradient(circle at 1px 1px, rgb(255 255 255 / 28%) 1px, transparent 1.5px) 0 0 / 24px 24px,
        linear-gradient(160deg, #1645f5 0%, #6791ff 42%, #eef3ff 100%);
    }
    a { color: inherit; }
    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px clamp(16px, 3vw, 40px) 0;
    }
    .topbar {
      width: min(100%, 1440px);
      min-height: 76px;
      margin: 0 auto;
      padding: 12px clamp(16px, 2.4vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border: 1px solid rgb(255 255 255 / 34%);
      border-radius: 999px;
      background: rgb(255 255 255 / 16%);
      box-shadow: 0 14px 36px rgb(8 35 133 / 16%);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      text-decoration: none;
      flex: 0 0 auto;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #b90069;
      box-shadow: 0 5px 16px rgb(179 0 98 / 28%);
    }
    .brand-mark .material-symbols-outlined { font-size: 23px; }
    .brand-name { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .brand-subtitle { margin-top: 2px; font-size: 9px; font-weight: 700; letter-spacing: .12em; }
    nav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 999px;
      background: rgb(255 255 255 / 10%);
    }
    nav a {
      padding: 10px 15px;
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    nav a[aria-current="page"] { color: #1239c8; background: #fff; }
    .account-icon, .settings-link {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      color: #fff;
    }
    .settings-link {
      gap: 6px;
      padding: 9px 14px;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .account-icon {
      width: 38px;
      height: 38px;
      border: 2px solid rgb(255 255 255 / 55%);
      border-radius: 50%;
      background: #173ac9;
    }
    main {
      min-height: calc(100vh - 104px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    .confirm-button {
      margin-top: auto;
      min-height: 62px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px clamp(22px, 4vw, 42px);
      border-radius: 999px;
      background: linear-gradient(100deg, #ff2e93, #df0872 58%, #1745ef);
      box-shadow: 0 14px 35px rgb(28 42 129 / 28%);
      color: #fff;
      font-size: clamp(14px, 1.5vw, 17px);
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .confirm-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgb(28 42 129 / 34%);
    }
    .confirm-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
    @media (max-width: 1200px) {
      .topbar { flex-wrap: wrap; border-radius: 28px; }
      nav { order: 3; width: 100%; justify-content: center; overflow-x: auto; }
      nav a { padding-inline: 12px; }
    }
    @media (max-width: 680px) {
      .topbar-wrap { padding: 8px 10px 0; }
      .topbar { gap: 10px; min-height: 62px; padding: 10px 13px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-name { font-size: 15px; }
      .brand-subtitle { font-size: 8px; }
      .settings-link { padding: 8px; font-size: 0; }
      nav { justify-content: flex-start; }
      nav a { font-size: 11px; }
      .confirm-button { width: min(100%, 420px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="topbar-wrap">
    <header class="topbar">
      <a class="brand" href="/dashboard">
        <span class="brand-mark"><span class="material-symbols-outlined">vital_signs</span></span>
        <span><span class="brand-name">LittleCare AI</span><br><span class="brand-subtitle">PEDIATRIC NEURO-SENSE</span></span>
      </a>
      <nav aria-label="Main navigation">
        <a data-page-link="dashboard" href="/dashboard">Child Profile</a>
        <a data-page-link="assessment" href="/dashboard">Assessment Launch</a>
        <a data-page-link="camera" href="/camera-telemetry">Camera Telemetry</a>
        <a aria-current="page" data-page-link="disambiguation" href="/ai-disambiguation">AI Disambiguation</a>
        <a data-page-link="report" href="/pain-scale-report">Pain Scale Report</a>
      </nav>
      <a class="settings-link" href="/dashboard"><span class="material-symbols-outlined">settings</span> Dashboard</a>
      <span class="account-icon" aria-label="Signed in"><span class="material-symbols-outlined">person</span></span>
    </header>
  </div>
  <main>
    <a class="confirm-button" data-page-link="report" href="/pain-scale-report">
      <span>Confirm &amp; View Final Pain Scale Report</span>
      <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
    </a>
  </main>
  <script>
    const profileId = new URLSearchParams(location.search).get('profileId')
      || sessionStorage.getItem('littlecare_profile_id');
    if (profileId && /^[1-9]\d{0,17}$/.test(profileId)) {
      sessionStorage.setItem('littlecare_profile_id', profileId);
      for (const [page, route] of Object.entries({
        dashboard: '/dashboard',
        assessment: '/assessment-launch',
        camera: '/camera-telemetry',
        disambiguation: '/ai-disambiguation',
        report: '/pain-scale-report'
      })) {
        document.querySelectorAll(`[data-page-link="${page}"]`).forEach((link) => {
          link.href = `${route}?profileId=${encodeURIComponent(profileId)}`;
        });
      }
    }
  </script>
</body>
</html>
